<script>
const state={view:'dashboard',data:null};
const titles={dashboard:'ダッシュボード',trades:'トレード記録',stocks:'銘柄記録',assets:'資産管理',policies:'トレード方針',favorites:'お気に入り銘柄',settings:'設定'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
document.addEventListener('DOMContentLoaded',()=>{bindShell();loadData()});
function gas(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e))).apply?google.script.run[name](...args):null)}
function call(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))));runner[name](...args)})}
function bindShell(){$$('#nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.view));$('#reloadBtn').onclick=loadData;$('#menuBtn').onclick=()=>$('.sidebar').classList.toggle('open');$$('[data-close-modal]').forEach(x=>x.onclick=closeModal)}
async function loadData(){showLoading();try{state.data=await call('getInitialData');render()}catch(e){showNotice(e.message);$('#content').innerHTML=empty('読み込みに失敗しました',e.message)}}
function navigate(view){state.view=view;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#pageTitle').textContent=titles[view];$('.sidebar').classList.remove('open');render()}
function render(){if(!state.data)return;if(!state.data.configured&&state.view!=='settings'){showNotice('最初に保存先を設定してください。');state.view='settings';$('#pageTitle').textContent=titles.settings} else hideNotice();const fn={dashboard:renderDashboard,trades:renderTrades,stocks:renderStocks,assets:renderAssets,policies:renderPolicies,favorites:renderFavorites,settings:renderSettings}[state.view];fn()}
function renderDashboard(){const d=state.data,s=d.summary||{};$('#content').innerHTML=`<div class="hero"><div><h2>おかえりなさい</h2><p>数字とルールを記録し、再現性のあるトレードへ。</p></div><button class="btn btn-primary" id="quickBuy">＋ 購入を記録</button></div><div class="stats">${stat('実現損益',yen(s.realizedProfit),numClass(s.realizedProfit))}${stat('保有取得額',yen(s.openCost))}${stat('勝率',(s.winRate||0)+'%')}${stat('総取引数',(s.tradeCount||0)+' 件')}</div><div class="grid-2"><div class="panel"><div class="panel-head"><h3>最近のトレード</h3><button class="mini-btn" data-go="trades">すべて見る</button></div>${tradeTable(d.trades.slice(0,7),false)}</div><div class="panel"><div class="panel-head"><h3>鉄のおきて</h3><button class="mini-btn" data-go="policies">管理</button></div><div class="panel-body">${policyCards(d.policies.filter(x=>x.pinned).slice(0,4))||empty('固定された方針はありません','「常に上位」をONにするとここに表示されます。')}</div></div></div>`;$('#quickBuy').onclick=()=>openTradeModal('buy');$$('[data-go]').forEach(b=>b.onclick=()=>navigate(b.dataset.go))}
function renderTrades(){const d=state.data;$('#content').innerHTML=`<div class="hero"><div><h2>トレード記録</h2><p>購入と売却をひとつの台帳で追跡します。</p></div><div class="button-row"><button class="btn btn-secondary" id="addSell">－ 売却を記録</button><button class="btn btn-primary" id="addBuy">＋ 購入を記録</button></div></div><div class="stats">${stat('保有ロット',d.openPurchases.length+' 件')}${stat('実現損益',yen(d.summary.realizedProfit),numClass(d.summary.realizedProfit))}${stat('勝率',d.summary.winRate+'%')}${stat('記録数',d.trades.length+' 件')}</div><div class="panel"><div class="panel-head"><h3>取引履歴</h3><input id="tradeSearch" class="searchbar" placeholder="銘柄名・コードで検索"></div><div id="tradeTable">${tradeTable(d.trades,true)}</div></div>`;$('#addBuy').onclick=()=>openTradeModal('buy');$('#addSell').onclick=()=>openTradeModal('sell');$('#tradeSearch').oninput=e=>{$('#tradeTable').innerHTML=tradeTable(d.trades.filter(t=>(t.name+t.symbol+t.notes).toLowerCase().includes(e.target.value.toLowerCase())),true);bindTradeActions()};bindTradeActions()}
function tradeTable(rows,actions){if(!rows.length)return empty('取引記録がありません','購入記録から始めましょう。');return `<div class="table-wrap"><table><thead><tr><th>日付</th><th>種別</th><th>銘柄</th><th>数量</th><th>取引単価</th><th>平均取得</th><th>実現損益</th><th>備考</th>${actions?'<th></th>':''}</tr></thead><tbody>${rows.map(t=>`<tr><td>${esc(t.date)}</td><td><span class="badge ${t.type==='購入'?'buy':'sell'}">${t.type}</span></td><td><span class="symbol">${esc(t.name)}</span><span class="subtext">${esc(t.symbol)}</span></td><td>${number(t.quantity)}</td><td>${yen(t.price)}</td><td>${yen(t.averagePrice)}</td><td class="${numClass(t.profit)}">${t.profit==null?'—':signedYen(t.profit)}</td><td title="${esc(t.notes)}">${esc(short(t.notes,18))||'—'}</td>${actions?`<td><button class="mini-btn" data-delete-trade="${t.id}">削除</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function bindTradeActions(){$$('[data-delete-trade]').forEach(b=>b.onclick=async()=>{if(!confirm('このトレード記録を削除しますか？'))return;await mutate('deleteTrade',b.dataset.deleteTrade,'削除しました')})}
function openTradeModal(kind){const open=state.data.openPurchases||[];if(kind==='sell'&&!open.length){toast('売却できる購入記録がありません');return}const sell=kind==='sell';openModal(`<h2>${sell?'売却':'購入'}を記録</h2><p>${sell?'購入ロットを選ぶと、銘柄と平均取得単価を自動で引き継ぎます。':'エントリー時点の判断も備考へ残しましょう。'}</p><form id="tradeForm"><div class="form-grid"><div class="field"><label>日付 *</label><input name="date" type="date" value="${today()}" required></div>${sell?`<div class="field full"><label>紐づける購入 *</label><select name="purchaseId" id="purchaseSelect" required>${open.map(p=>`<option value="${p.id}" data-remain="${p.remainingQuantity}" data-avg="${p.averagePrice}">${esc(p.date+'｜'+p.symbol+' '+p.name+'｜残 '+number(p.remainingQuantity)+'株｜平均 '+yen(p.averagePrice))}</option>`).join('')}</select><div class="help" id="lotHelp"></div></div>`:`<div class="field"><label>銘柄コード *</label><input name="symbol" placeholder="例 7203" required></div><div class="field"><label>銘柄名 *</label><input name="name" placeholder="例 トヨタ自動車" required></div>`}<div class="field"><label>${sell?'売却数':'購入数'} *</label><input name="quantity" type="number" min="0.0001" step="any" required></div><div class="field"><label>${sell?'売却単価':'取得単価'} *</label><input name="price" type="number" min="0.0001" step="any" required></div>${sell?'':`<div class="field"><label>平均取得単価</label><input name="averagePrice" type="number" step="any" placeholder="未入力なら取得単価"></div><div class="field"><label>利確目標</label><input name="targetPrice" type="number" step="any"></div>`}<div class="field full"><label>備考</label><textarea name="notes" placeholder="エントリー根拠、相場環境、感情、反省点など"></textarea></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close>キャンセル</button><button class="btn btn-primary">記録する</button></div></form>`);if(sell){const sel=$('#purchaseSelect'),help=$('#lotHelp');const update=()=>help.textContent='売却可能数: '+sel.selectedOptions[0].dataset.remain+'｜平均取得単価: '+yen(sel.selectedOptions[0].dataset.avg);sel.onchange=update;update()}$('#tradeForm').onsubmit=async e=>{e.preventDefault();const data=formData(e.target);await mutate(sell?'addSale':'addPurchase',data,sell?'売却と損益を記録しました':'購入を記録しました')};$('[data-close]').onclick=closeModal}
function renderStocks(){const rows=state.data.stocks;$('#content').innerHTML=`<div class="hero"><div><h2>銘柄記録</h2><p>複数の購入・利確目標と直近決算をまとめて管理します。</p></div><button class="btn btn-primary" id="addStock">＋ 銘柄を追加</button></div><div class="stock-grid">${rows.map(stockCard).join('')||empty('銘柄記録がありません','気になる銘柄の価格帯を記録しましょう。')}</div>`;$('#addStock').onclick=()=>openStockModal();$$('[data-edit-stock]').forEach(b=>b.onclick=()=>openStockModal(rows.find(x=>x.id===b.dataset.editStock)));bindGenericDeletes()}
function stockCard(s){const buys=s.buyTargets||[],profits=s.takeProfitTargets||[],buy=buys.length?Math.max.apply(null,buys):null,discount=s.currentPrice&&buy?Math.round((s.currentPrice-buy)/s.currentPrice*100):null;return `<article class="stock-card"><span class="ticker">${esc(s.symbol)}</span><h3>${esc(s.name)}</h3><div class="quote-grid"><div class="quote"><label>現在値</label><strong>${yen(s.currentPrice)}</strong></div><div class="quote"><label>購入目標</label><strong>${priceList(buys)}</strong></div><div class="quote"><label>利確目標</label><strong>${priceList(profits)}</strong></div><div class="quote"><label>1年高値 / 安値</label><strong>${yen(s.yearHigh)} / ${yen(s.yearLow)}</strong></div></div>${discount!=null?`<div class="progress"><span style="width:${Math.max(0,Math.min(100,100-discount))}%"></span></div><span class="subtext">最も近い購入目標まで ${discount}%</span>`:''}${earningsSummary(s.earningsData,s.earningsFetchedAt)}<p class="stock-note">${esc(s.notes)||'メモなし'}</p><div class="actions"><button class="mini-btn" data-edit-stock="${s.id}">編集・情報更新</button><button class="mini-btn danger-text" data-delete="stocks:${s.id}">削除</button></div></article>`}
function openStockModal(s={}){openModal(`<h2>${s.id?'銘柄記録を編集':'銘柄を追加'}</h2><p>価格情報と直近の決算情報を取得し、購入・利確目標を複数登録できます。</p><form id="stockForm"><input type="hidden" name="id" value="${s.id||''}"><div class="form-grid"><div class="field"><label>銘柄コード *</label><input name="symbol" id="stockSymbol" value="${esc(s.symbol||'')}" placeholder="日本株 7203 / 米国株 AAPL" required></div><div class="field"><label>銘柄名 *</label><input name="name" id="stockName" value="${esc(s.name||'')}" required></div><div class="field full"><div class="button-row"><button type="button" class="btn btn-secondary" id="fetchQuote">↻ 株価・1年高安を取得</button><button type="button" class="btn btn-secondary" id="fetchEarnings">▤ 直近の決算情報を取得</button></div><span class="help" id="marketStatus"></span></div><div class="field full"><label>購入目標</label><div id="buyTargets" class="target-list">${targetInputs('buyTargetItem',s.buyTargets)}</div><button type="button" class="mini-btn add-target" data-target-list="buyTargets" data-target-name="buyTargetItem">＋ 購入目標を追加</button></div><div class="field full"><label>利確目標</label><div id="takeProfitTargets" class="target-list">${targetInputs('takeProfitItem',s.takeProfitTargets)}</div><button type="button" class="mini-btn add-target" data-target-list="takeProfitTargets" data-target-name="takeProfitItem">＋ 利確目標を追加</button></div><div class="field"><label>現在値</label><input name="currentPrice" id="currentPrice" type="number" step="any" value="${val(s.currentPrice)}"></div><div class="field"><label>1年高値</label><input name="yearHigh" id="yearHigh" type="number" step="any" value="${val(s.yearHigh)}"></div><div class="field"><label>1年安値</label><input name="yearLow" id="yearLow" type="number" step="any" value="${val(s.yearLow)}"></div><input type="hidden" name="quotedAt" id="quotedAt" value="${s.quotedAt||''}"><input type="hidden" name="earningsData" id="earningsData" value="${esc(s.earningsData?JSON.stringify(s.earningsData):'')}"><input type="hidden" name="earningsFetchedAt" id="earningsFetchedAt" value="${s.earningsFetchedAt||''}"><div class="field full"><label>取得した決算情報</label><div id="earningsPreview" class="earnings-preview">${earningsSummary(s.earningsData,s.earningsFetchedAt,true)}</div></div><div class="field full"><label>備考</label><textarea name="notes">${esc(s.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close>キャンセル</button><button class="btn btn-primary">保存</button></div></form>`);bindTargetEditors();$('#fetchQuote').onclick=async()=>{const b=$('#fetchQuote'),status=$('#marketStatus');b.disabled=true;status.textContent='株価を取得中…';try{const q=await call('fetchMarketData',$('#stockSymbol').value);$('#stockSymbol').value=q.symbol;if(q.name&&!$('#stockName').value)$('#stockName').value=q.name;$('#currentPrice').value=q.currentPrice;$('#yearHigh').value=q.yearHigh;$('#yearLow').value=q.yearLow;$('#quotedAt').value=q.quotedAt;status.textContent='株価を取得しました（'+(q.currency||'通貨不明')+'）'}catch(e){status.textContent=e.message}finally{b.disabled=false}};$('#fetchEarnings').onclick=async()=>{const b=$('#fetchEarnings'),status=$('#marketStatus');b.disabled=true;status.textContent='決算情報を取得中…';try{const d=await call('fetchRecentEarnings',$('#stockSymbol').value);$('#earningsData').value=JSON.stringify(d);$('#earningsFetchedAt').value=d.fetchedAt;$('#earningsPreview').innerHTML=earningsSummary(d,d.fetchedAt,true);status.textContent='直近の決算情報を取得しました'}catch(e){status.textContent=e.message}finally{b.disabled=false}};$('#stockForm').onsubmit=async e=>{e.preventDefault();const data=formData(e.target);data.buyTargets=$$('input[name="buyTargetItem"]',e.target).map(x=>x.value).filter(Boolean);data.takeProfitTargets=$$('input[name="takeProfitItem"]',e.target).map(x=>x.value).filter(Boolean);await mutate('saveStock',data,'銘柄記録を保存しました')};$('[data-close]').onclick=closeModal}
function targetInputs(name,values){const rows=(values&&values.length?values:['']);return rows.map(v=>`<div class="target-row"><input name="${name}" type="number" min="0.0001" step="any" value="${val(v)}" placeholder="価格を入力"><button type="button" class="mini-btn danger-text remove-target">削除</button></div>`).join('')}
function bindTargetEditors(){[...document.querySelectorAll('.add-target')].forEach(b=>b.onclick=()=>{const list=$('#'+b.dataset.targetList);list.insertAdjacentHTML('beforeend',targetInputs(b.dataset.targetName,['']));bindRemoveTargets()});bindRemoveTargets()}
function bindRemoveTargets(){[...document.querySelectorAll('.remove-target')].forEach(b=>b.onclick=()=>{const list=b.closest('.target-list'),name=list.id==='buyTargets'?'buyTargetItem':'takeProfitItem';b.closest('.target-row').remove();if(!list.children.length)list.insertAdjacentHTML('beforeend',targetInputs(name,['']));bindRemoveTargets()})}
function priceList(values){return values&&values.length?values.map(yen).join('<br>'):'—'}
function earningsSummary(d,fetchedAt,detail){if(!d)return detail?'<span class="help">まだ取得していません。</span>':'';const parts=[d.period?'<strong>'+esc(d.period)+'</strong>':'',d.epsActual!=null?'EPS '+number(d.epsActual)+(d.epsEstimate!=null?'（予想 '+number(d.epsEstimate)+'）':''):'',d.revenue!=null?'売上 '+compactNumber(d.revenue):'',d.netIncome!=null?'純利益 '+compactNumber(d.netIncome):'',d.epsSurprisePercent!=null?'EPS乖離 '+number(Number(d.epsSurprisePercent)*100)+'%':'',d.nextEarningsDate?'次回予定 '+esc(String(d.nextEarningsDate).slice(0,10)):''].filter(Boolean);return '<div class="earnings-box">'+parts.join('<span>｜</span>')+(fetchedAt?'<small>取得 '+esc(String(fetchedAt).slice(0,10))+'</small>':'')+'</div>'}
function compactNumber(v){return Number(v).toLocaleString('ja-JP',{notation:'compact',maximumFractionDigits:2})}
function renderAssets(){
  const rows=state.data.assets||[],dates=[...new Set(rows.map(x=>x.date))].sort().reverse();
  if(!state.assetDate||!dates.includes(state.assetDate))state.assetDate=dates[0]||today();
  const selected=rows.filter(x=>x.date===state.assetDate);
  const total=selected.reduce((n,x)=>n+x.netAssets,0),cash=selected.reduce((n,x)=>n+x.cash,0),securities=selected.reduce((n,x)=>n+x.securities,0);
  $('#content').innerHTML=`<div class="hero"><div><h2>資産管理</h2><p>ある日時点の資産状況を証券会社ごとに記録します。</p></div><button class="btn btn-primary" id="addAsset">＋ 資産状況を記録</button></div><div class="asset-toolbar"><div class="field"><label>表示する基準日</label><select id="assetDate">${dates.length?dates.map(d=>`<option value="${d}" ${d===state.assetDate?'selected':''}>${d}</option>`).join(''):`<option value="${today()}">${today()}</option>`}</select></div></div><div class="stats">${stat('純資産合計',yen(total))}${stat('現金残高',yen(cash))}${stat('保有商品評価額',yen(securities))}${stat('証券会社',selected.length+' 社')}</div><div class="stock-grid asset-grid">${selected.map(assetCard).join('')||empty('この日の資産記録がありません','証券会社ごとの残高を記録しましょう。')}</div><div class="panel asset-history"><div class="panel-head"><h3>資産履歴</h3><span class="subtext">新しい基準日順</span></div>${assetTable(rows)}</div>`;
  $('#addAsset').onclick=()=>openAssetModal({date:state.assetDate});
  $('#assetDate').onchange=e=>{state.assetDate=e.target.value;renderAssets()};
  [...document.querySelectorAll('[data-edit-asset]')].forEach(b=>b.onclick=()=>openAssetModal(rows.find(x=>x.id===b.dataset.editAsset)));
  [...document.querySelectorAll('[data-sort-asset]')].forEach(b=>b.onclick=()=>{const key=b.dataset.sortAsset;state.assetSortDir=state.assetSort===key?(state.assetSortDir==='asc'?'desc':'asc'):(key==='date'?'desc':'asc');state.assetSort=key;renderAssets()});
  bindGenericDeletes();
}
function assetCard(a){return `<article class="stock-card asset-card"><span class="ticker">${esc(a.date)}</span><h3>${esc(a.broker)}</h3><div class="quote-grid"><div class="quote"><label>純資産</label><strong>${yen(a.netAssets)}</strong></div><div class="quote"><label>現金</label><strong>${yen(a.cash)}</strong></div><div class="quote"><label>保有商品</label><strong>${yen(a.securities)}</strong></div><div class="quote"><label>負債</label><strong>${yen(a.liabilities)}</strong></div></div><p class="stock-note">${esc(a.notes)||'メモなし'}</p><div class="actions"><button class="mini-btn" data-edit-asset="${a.id}">編集</button><button class="mini-btn danger-text" data-delete="assets:${a.id}">削除</button></div></article>`}
function assetTable(rows){if(!rows.length)return empty('資産履歴がありません','最初の資産状況を記録しましょう。');const key=state.assetSort||'date',dir=state.assetSortDir||'desc',sorted=[...rows].sort((a,b)=>{const av=String(a[key]||''),bv=String(b[key]||''),c=av.localeCompare(bv,'ja');return (dir==='asc'?c:-c)||String(b.date).localeCompare(String(a.date))}),arrow=k=>key===k?(dir==='asc'?' ▲':' ▼'):'';return `<div class="table-wrap"><table><thead><tr><th><button class="sort-btn" data-sort-asset="date">基準日${arrow('date')}</button></th><th><button class="sort-btn" data-sort-asset="broker">証券会社${arrow('broker')}</button></th><th>現金</th><th>保有商品</th><th>その他資産</th><th>負債</th><th>純資産</th><th></th></tr></thead><tbody>${sorted.map(a=>`<tr><td>${esc(a.date)}</td><td class="symbol">${esc(a.broker)}</td><td>${yen(a.cash)}</td><td>${yen(a.securities)}</td><td>${yen(a.otherAssets)}</td><td>${yen(a.liabilities)}</td><td><strong>${yen(a.netAssets)}</strong></td><td><button class="mini-btn" data-edit-asset="${a.id}">編集</button></td></tr>`).join('')}</tbody></table></div>`}
function openAssetModal(a={}){
  openModal(`<h2>資産状況を${a.id?'編集':'記録'}</h2><p>同じ基準日で証券会社ごとに登録すると、その日時点の合計を確認できます。</p><form id="assetForm"><input type="hidden" name="id" value="${a.id||''}"><div class="form-grid"><div class="field"><label>基準日 *</label><input name="date" type="date" value="${a.date||today()}" required></div><div class="field"><label>証券会社 *</label><input name="broker" value="${esc(a.broker||'')}" placeholder="例 SBI証券" required></div><div class="field"><label>現金残高</label><input name="cash" class="asset-amount" type="number" min="0" step="any" value="${val(a.cash)}" placeholder="0"></div><div class="field"><label>保有商品評価額</label><input name="securities" class="asset-amount" type="number" min="0" step="any" value="${val(a.securities)}" placeholder="0"></div><div class="field"><label>その他資産</label><input name="otherAssets" class="asset-amount" type="number" min="0" step="any" value="${val(a.otherAssets)}" placeholder="0"></div><div class="field"><label>負債</label><input name="liabilities" class="asset-amount" type="number" min="0" step="any" value="${val(a.liabilities)}" placeholder="0"></div><div class="field full asset-total"><label>純資産（自動計算）</label><strong id="assetTotal">¥0</strong><div class="help">現金＋保有商品＋その他資産－負債</div></div><div class="field full"><label>備考</label><textarea name="notes" placeholder="入出金、評価変動、確認事項など">${esc(a.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close>キャンセル</button><button class="btn btn-primary">保存</button></div></form>`);
  const update=()=>{const f=$('#assetForm'),n=name=>Number(f.elements[name].value||0);$('#assetTotal').textContent=yen(n('cash')+n('securities')+n('otherAssets')-n('liabilities'))};
  [...document.querySelectorAll('.asset-amount')].forEach(x=>x.oninput=update);update();
  $('#assetForm').onsubmit=async e=>{e.preventDefault();const data=formData(e.target);state.assetDate=data.date;await mutate('saveAsset',data,'資産状況を保存しました')};
  $('[data-close]').onclick=closeModal;
}
function renderPolicies(){const rows=state.data.policies;$('#content').innerHTML=`<div class="hero"><div><h2>トレード方針</h2><p>相場に入る前に読む、自分との約束。</p></div><button class="btn btn-primary" id="addPolicy">＋ 鉄のおきてを追加</button></div><div class="panel"><div class="panel-body">${policyCards(rows,true)||empty('トレード方針がありません','守るルールを言葉にしておきましょう。')}</div></div>`;$('#addPolicy').onclick=()=>openPolicyModal();$$('[data-edit-policy]').forEach(b=>b.onclick=()=>openPolicyModal(rows.find(x=>x.id===b.dataset.editPolicy)));bindGenericDeletes()}
function policyCards(rows,actions){return rows.map(p=>`<article class="policy-card ${p.pinned?'pinned':''}"><div class="policy-meta"><span>${esc(p.date)} ${p.pinned?'<span class="badge pin">◆ 常に上位</span>':''}</span>${actions?`<span class="actions"><button class="mini-btn" data-edit-policy="${p.id}">編集</button><button class="mini-btn danger-text" data-delete="policies:${p.id}">削除</button></span>`:''}</div><p>${esc(p.rule)}</p></article>`).join('')}
function openPolicyModal(p={}){openModal(`<h2>鉄のおきて</h2><p>固定したルールは一覧とダッシュボードの上位に表示されます。</p><form id="policyForm"><input type="hidden" name="id" value="${p.id||''}"><div class="form-grid"><div class="field"><label>日付 *</label><input name="date" type="date" value="${p.date||today()}" required></div><div class="field"><label><input name="pinned" type="checkbox" ${p.pinned?'checked':''}> 常に上位に表示</label></div><div class="field full"><label>鉄のおきて *</label><textarea name="rule" required placeholder="例：損切りラインを決めずにエントリーしない">${esc(p.rule||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close>キャンセル</button><button class="btn btn-primary">保存</button></div></form>`);$('#policyForm').onsubmit=async e=>{e.preventDefault();await mutate('savePolicy',formData(e.target),'方針を保存しました')};$('[data-close]').onclick=closeModal}
function renderFavorites(){const rows=state.data.favorites;$('#content').innerHTML=`<div class="hero"><div><h2>お気に入り銘柄</h2><p>数字だけでは見えない、投資仮説とリスクを保存します。</p></div><button class="btn btn-primary" id="addFav">＋ お気に入りを追加</button></div><div class="stock-grid">${rows.map(f=>`<article class="stock-card"><span class="ticker">${esc(f.symbol)} ${esc(f.market)}</span><h3>${esc(f.name)}</h3><span class="badge">${esc(f.sector)||'業種未設定'}</span><p class="stock-note"><strong>投資理由</strong><br>${esc(f.thesis)||'—'}<br><br><strong>リスク</strong><br>${esc(f.risk)||'—'}</p><div class="quote"><label>目標株価</label><strong>${yen(f.targetPrice)}</strong></div><div class="actions" style="margin-top:14px"><button class="mini-btn" data-edit-fav="${f.id}">編集</button><button class="mini-btn danger-text" data-delete="favorites:${f.id}">削除</button></div></article>`).join('')||empty('お気に入りがありません','ウォッチしたい銘柄を保存しましょう。')}</div>`;$('#addFav').onclick=()=>openFavoriteModal();$$('[data-edit-fav]').forEach(b=>b.onclick=()=>openFavoriteModal(rows.find(x=>x.id===b.dataset.editFav)));bindGenericDeletes()}
function openFavoriteModal(f={}){openModal(`<h2>お気に入り銘柄</h2><p>買いたい理由と、見落としたくないリスクをセットで記録します。</p><form id="favForm"><input type="hidden" name="id" value="${f.id||''}"><div class="form-grid"><div class="field"><label>銘柄コード *</label><input name="symbol" value="${esc(f.symbol||'')}" required></div><div class="field"><label>銘柄名 *</label><input name="name" value="${esc(f.name||'')}" required></div><div class="field"><label>市場</label><input name="market" value="${esc(f.market||'')}" placeholder="東証プライム / NASDAQ"></div><div class="field"><label>業種</label><input name="sector" value="${esc(f.sector||'')}"></div><div class="field full"><label>投資理由</label><textarea name="thesis">${esc(f.thesis||'')}</textarea></div><div class="field full"><label>注目材料</label><textarea name="catalyst">${esc(f.catalyst||'')}</textarea></div><div class="field full"><label>リスク</label><textarea name="risk">${esc(f.risk||'')}</textarea></div><div class="field"><label>目標株価</label><input name="targetPrice" type="number" step="any" value="${val(f.targetPrice)}"></div><div class="field full"><label>メモ</label><textarea name="notes">${esc(f.notes||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn btn-secondary" data-close>キャンセル</button><button class="btn btn-primary">保存</button></div></form>`);$('#favForm').onsubmit=async e=>{e.preventDefault();await mutate('saveFavorite',formData(e.target),'お気に入りを保存しました')};$('[data-close]').onclick=closeModal}
function bindGenericDeletes(){$$('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('この記録を削除しますか？'))return;const [type,id]=b.dataset.delete.split(':');await mutate('deleteRecord',type,id,'削除しました')})}
function renderSettings(){$('#content').innerHTML=`<div class="hero"><div><h2>設定</h2><p>記録を保存するGoogleスプレッドシートを指定します。</p></div></div><div class="panel settings-card"><div class="panel-body"><div class="callout">初回だけ設定が必要です。新しいスプレッドシートを自動作成するか、既存スプレッドシートのURL / IDを保存してください。必要なシートと見出しは自動で作成されます。</div><form id="settingsForm"><div class="field"><label>スプレッドシート URL または ID</label><input name="spreadsheetId" placeholder="https://docs.google.com/spreadsheets/d/..."></div><div class="form-actions"><button type="button" class="btn btn-secondary" id="createSheet">新規作成する</button><button class="btn btn-primary">この保存先を使用</button></div></form></div></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();await mutate('saveSettings',formData(e.target),'保存先を設定しました')};$('#createSheet').onclick=async()=>{if(!confirm('新しいスプレッドシートを作成しますか？'))return;try{showLoading();const r=await call('createSpreadsheet');toast('「'+r.name+'」を作成しました');state.data=await call('getInitialData');state.view='dashboard';render()}catch(e){toast(e.message,true)}}}
async function mutate(name,...args){const message=args.pop();try{const submit=$('.modal .btn-primary');if(submit){submit.disabled=true;submit.textContent='保存中…'}await call(name,...args);closeModal();state.data=await call('getInitialData');render();toast(message)}catch(e){toast(e.message,true);const submit=$('.modal .btn-primary');if(submit){submit.disabled=false;submit.textContent='保存する'}}}
function openModal(html){$('#modalBody').innerHTML=html;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden');$('#modalBody').innerHTML=''}
function showLoading(){$('#content').innerHTML='<div class="loader"><span></span><p>データを読み込んでいます</p></div>'}function showNotice(s){$('#notice').textContent=s;$('#notice').classList.remove('hidden')}function hideNotice(){$('#notice').classList.add('hidden')}
function toast(s,error){const t=$('#toast');t.textContent=s;t.style.background=error?'#9d3f3f':'#102a22';t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),3200)}
function formData(form){const d={};new FormData(form).forEach((v,k)=>d[k]=v);$$('input[type=checkbox]',form).forEach(x=>d[x.name]=x.checked);return d}
function stat(label,value,cls=''){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls}">${value}</div></div>`}function empty(a,b){return `<div class="empty"><strong>${a}</strong>${b}</div>`}
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function val(v){return v==null?'':v}function number(v){return Number(v||0).toLocaleString('ja-JP',{maximumFractionDigits:4})}function yen(v){return v==null||v===''?'—':'¥'+Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2})}function signedYen(v){return (Number(v)>0?'+':'')+yen(v)}function numClass(v){return Number(v)>0?'positive':Number(v)<0?'negative':''}function short(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'…':s}function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
</script>
